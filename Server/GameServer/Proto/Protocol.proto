syntax = "proto3";

package Protocol;

import "Struct.proto";

message CS_REQ_ENTER_GAME
{
    int32 char_id = 1;
    int32 token = 2;
}

message SC_ENTER_GAME_RESULT
{ 
    bool success = 1; 
    int32 error_code = 2; 
}

message CS_REQ_MOVE_FIELD
{
    uint32 map_id = 1;
}

message CS_USE_PORTAL
{
    uint32 portal_id = 1;
}

message SC_MOVE_FIELD_FAIL 
{ 
    int32 error_code = 1; 
}

message SC_START_FIELD_LOADING
{
    uint32 target_map_id = 1;
}

message CS_FIELD_LOADING_COMPLETE
{
    bool is_success = 1; 
}

message SC_ENTER_FIELD
{ 
    PlayerInfo my_info = 1;
}

message SC_SPAWN_PLAYER
{
    repeated PlayerInfo info = 1;
}

message SC_DESPAWN_PLAYER
{
    uint64 player_id = 1;
}

message CS_REQUEST_MOVE
{
    Vector3 pos = 1;
    uint64 client_tick = 2;
}

message SC_MOVE_PATH
{
    uint64 object_id = 1;
    uint64 start_server_tick = 2;
    repeated WayPoint waypoints = 3;
}

message SC_TIME_SYNC
{
    int64 server_offset = 1;
    uint32 rtt = 2;
}

message SC_PING
{
    uint64 server_send_tick = 1;
}

message CS_PONG
{
    uint64 server_send_tick = 1;
    uint64 client_recv_tick = 2;
    uint64 client_send_tick = 3;
}